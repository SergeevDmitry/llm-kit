name: Runtime matrix

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow only builds and exercises packages.
# Third-party actions are pinned to commit SHAs — see the comment at the top
# of release.yml for why, and how to bump them.
permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run validate:artifacts

  bun:
    name: Bun (packages without native dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Bun support is claimed only for packages this job actually exercises,
      # and it exercises them rather than merely importing them — an
      # import-only check passes for code that fails the moment it touches a
      # runtime-specific path.
      #
      # `vec-cache` is excluded: `better-sqlite3` is not supported under Bun,
      # so it cannot work there and the README says so outright. To check
      # whether Bun has caught up, run
      # `bun run scripts/bun-smoke.ts --include-native` locally.
      - name: Bun smoke test
        run: bun run scripts/bun-smoke.ts

  # Disabled: this exercised `vec-cache` under Bun, where `better-sqlite3`
  # cannot load (oven-sh/bun#4290). It was a permanently failing job asserting
  # something the README already states outright, and `continue-on-error: true`
  # did not stop GitHub reporting the check as red. Re-enable once Bun can load
  # the native addon — `bun run scripts/bun-smoke.ts --include-native` locally
  # is how to tell.
  #
  # bun-native:
  #   name: Bun (vec-cache, best effort)
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '20'
  #         cache: pnpm
  #     - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  #       with:
  #         bun-version: latest
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm --filter vec-cache run build
  #     - name: vec-cache under Bun
  #       run: bun run scripts/bun-smoke.ts --include-native

  browser-bundle:
    name: Browser bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # vec-cache is excluded by design: it is a Node-only package.
      - run: pnpm exec tsx scripts/browser-bundle-smoke.ts
