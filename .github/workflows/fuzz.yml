name: Fuzz

# Scheduled and non-blocking for pull requests.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: 'Property-test runs per suite'
        required: false
        default: '20000'

# Read-only: this workflow only runs tests.
permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.package }} fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [mend-json, token-chunk, chat-fit]
    env:
      # Read by `fuzzConfig` in @llm-kit/test-utils, which every fc.assert call
      # site uses. Without this wired up, the scheduled job would re-run the
      # pull-request suite at the pull-request run count on fixed seeds and
      # never surface an input the PR run had not already tried.
      FUZZ_RUNS: ${{ github.event.inputs.runs || '20000' }}
      # Vary the region explored per run. fast-check reports the seed on
      # failure, so a red nightly job can be replayed locally by setting
      # FUZZ_SEED to the value in its log.
      FUZZ_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA — see the comment at the top of release.yml.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `exec vitest`, not `run test -- …`: pnpm inserts its own `--`, so the
      # flag reached vitest as a positional argument and was ignored — the job
      # silently ran the entire suite instead of the property tests.
      #
      # `--outputFile.json=` (object form), not the flat `--outputFile=`:
      # vitest documents the object form as required once more than one
      # reporter is configured. Both forms happen to write the file on the
      # pinned version — measured — so this is removing a version-dependent
      # assumption from the one step that keeps the guard below honest.
      - name: Extended property tests
        run: >-
          pnpm --filter ${{ matrix.package }} exec vitest run
          --testNamePattern="property|fuzz"
          --reporter=default
          --reporter=json --outputFile.json="${{ github.workspace }}/fuzz-report.json"

      # A name filter that matches nothing exits 0 with every test skipped —
      # `--passWithNoTests` does not help, because the test *files* were still
      # found. Measured: an unmatched pattern reports numPassedTests 0 and exit
      # code 0. Without this guard a typo in the pattern turns the nightly fuzz
      # into a permanently green no-op, which is the failure this whole job
      # already had once.
      - name: Fail if the filter matched no property tests
        run: |
          node -e '
            const r = require("${{ github.workspace }}/fuzz-report.json");
            if (!(r.numPassedTests > 0)) {
              console.error(`fuzz filter matched no tests (numPassedTests=${r.numPassedTests}) — the pattern is wrong or the property tests were renamed`);
              process.exit(1);
            }
            console.log(`ran ${r.numPassedTests} property/fuzz tests`);
          '
