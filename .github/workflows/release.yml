name: Release

# Third-party actions are pinned to full commit SHAs, not tags. A tag — and a
# `v1`-style major tag especially — is a mutable pointer its maintainer can
# repoint at any time, and this workflow hands `NPM_TOKEN` and an OIDC identity
# to whatever it resolves to. Two of the three references this file used to
# carry were live examples of the problem:
#
#   * `changesets/action@v1` resolved to a *branch* (refs/heads/v1), not a tag,
#     so any push to that branch changed what ran here.
#   * `pnpm/action-setup@v4` resolved to a commit *older* than the v4.4.0 tag —
#     the major tag had been moved backwards over a revert.
#
# SHAs below were resolved from the GitHub API and each is the commit the
# named ref pointed to at that moment, so pinning changed nothing about what
# runs. Let Dependabot move them; verify a SHA against its tag before
# accepting a bump.
#
# When resolving a tag, note that `git/ref/tags/<tag>` returns an *annotated
# tag object* for these repositories, not a commit — its `object.sha` is the
# tag, and pinning that value is wrong. Dereference it through
# `git/tags/<sha>` to get the commit. `pnpm/action-setup@v6.0.10` resolved to
# tag `ff378ebe…`, whose commit is the `0977fd99…` pinned below.
#
# Action runtimes must be `node24`. GitHub deprecated the `node20` runtime and
# force-runs those actions on Node 24 with a warning; every action referenced
# here has been checked. This is the runtime GitHub executes the action's own
# JavaScript on, and is unrelated to the `node-version` given to
# `setup-node`, which is what the packages are tested against.
#
# `actions/checkout` and `actions/setup-node` are deliberately left on major
# tags: they are published by GitHub itself from the same trust domain that
# runs the workflow, so pinning them protects against nothing this workflow is
# not already exposed to.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

# Permissions are declared per job, not workflow-wide. `post-publish-smoke`
# installs freshly published packages from npm and executes them; it must not
# hold a repo-write token or an OIDC identity while doing so.
permissions: {}

jobs:
  # `pnpm run ci` covers the browser bundle smoke test, but not the Bun one —
  # Bun cannot be installed from a plain pnpm script, so it needs a runner step.
  # Without this job the only mechanical check behind `vec-cache`'s and the
  # universal packages' advertised Bun support lived in `runtime-matrix.yml`,
  # which triggers independently and shares no ordering with this workflow —
  # a red matrix run and a successful publish of the same commit could be
  # concurrent, unrelated events. `release` now needs this.
  bun-smoke:
    name: Bun runtime smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Exercises each universal package under Bun rather than merely importing
      # it: an import-only check can pass while the package fails as soon as it
      # touches a Bun-specific runtime path, which is a false green.
      - run: pnpm run smoke:bun

  release:
    name: Changesets version / publish
    needs: [bun-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets pushes the version commit
      pull-requests: write # ...and opens the release PR
      id-token: write # npm provenance attestation
    outputs:
      # Surfaced so `post-publish-smoke` can gate on it. Without this block
      # `needs.release.outputs.published` is the empty string and every
      # condition referencing it is silently false.
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Full verification before publishing
        run: pnpm run ci

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is also enabled in .npmrc. Both layers agree
          # deliberately — see the comment there.
          NPM_CONFIG_PROVENANCE: 'true'

  post-publish-smoke:
    name: Install published packages from npm
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Smoke test published artifacts
        run: node scripts/post-publish-smoke.mjs
