name: Provider data validation

on:
  push:
    branches: [master]
    paths:
      - 'docs/provider-data/**'
      - 'internal/model-registry/**'
      - 'packages/llm-price/**'
      - 'scripts/generate-model-registry.ts'
  pull_request:
    paths:
      - 'docs/provider-data/**'
      - 'internal/model-registry/**'
      - 'packages/llm-price/**'
      - 'scripts/generate-model-registry.ts'
  workflow_dispatch:

# Read-only: this workflow only validates committed data.
permissions:
  contents: read

jobs:
  registry:
    name: Schema, determinism, golden costs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit SHA — see the comment at the top of release.yml.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate provider source schema
        run: pnpm exec tsx scripts/verify-pricing-data.ts

      - name: Regenerate registry and fail on diff
        run: pnpm --filter llm-price run verify:registry

      - name: Golden cost fixtures
        run: pnpm --filter llm-price run test
