name: Provider data validation

on:
  push:
    branches: [master]
    paths:
      - 'docs/provider-data/**'
      - 'internal/model-registry/**'
      - 'packages/usage-tab/**'
      - 'scripts/generate-model-registry.ts'
  pull_request:
    paths:
      - 'docs/provider-data/**'
      - 'internal/model-registry/**'
      - 'packages/usage-tab/**'
      - 'scripts/generate-model-registry.ts'
  workflow_dispatch:

# Read-only: this workflow only validates committed data.
permissions:
  contents: read

jobs:
  registry:
    name: Schema, determinism, golden costs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit SHA — see the comment at the top of release.yml.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate provider source schema
        run: pnpm exec tsx scripts/verify-pricing-data.ts

      - name: Regenerate registry and fail on diff
        run: pnpm --filter usage-tab run verify:registry

      - name: Golden cost fixtures
        run: pnpm --filter usage-tab run test
